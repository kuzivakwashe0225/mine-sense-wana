# One origin for the app, the API and sign-in, so the sign-in cookie is first-party and a refresh keeps the
# person signed in. TLS is added in front (system Caddy on the server, or the `caddy` profile in compose).
server_tokens off;
client_max_body_size 10m;

map $http_x_forwarded_proto $fwd_proto { default $http_x_forwarded_proto; "" $scheme; }

upstream api      { server api:8000; keepalive 16; }
upstream keycloak { server keycloak:8080; }

server {
    listen 8080;
    root /usr/share/nginx/html;

    # security headers for the app pages (Keycloak sets its own on /auth)
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org; connect-src 'self' https://tile.openstreetmap.org; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self'; font-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'";

    location = /healthz { access_log off; return 200 "ok\n"; }

    # internal only: Prometheus scrapes the API directly on the container network
    location = /metrics { return 404; }
    location /api/metrics { return 404; }

    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 300s;
        # streaming retrain progress must reach the browser line by line
        location /api/model/retrain/stream {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
            proxy_buffering off;
            proxy_read_timeout 600s;
        }
    }

    # the Keycloak admin console and admin API are never public; use an SSH tunnel to 127.0.0.1:8180
    location /auth/admin/ { return 404; }
    location /auth/metrics { return 404; }
    location /auth/health { return 404; }

    location /auth/ {
        proxy_pass http://keycloak;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # framed by our own page to check the sign-in silently on refresh: same-origin framing only
    location = /silent-check-sso.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # the service worker and the page itself must never be cached, or updates would not reach phones
    location = /sw.js { add_header Cache-Control "no-cache" always; add_header Content-Security-Policy $csp always; }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        # the map's module worker: nginx's default types do not know .mjs, and browsers refuse
        # module scripts served as application/octet-stream
        location ~* \.mjs$ {
            types { }
            default_type text/javascript;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options nosniff always;
        }
    }
    location / {
        try_files $uri /index.html;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
