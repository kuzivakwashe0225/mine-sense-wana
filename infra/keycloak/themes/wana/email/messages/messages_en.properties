executeActionsSubject=Your MineSense Wana account: choose your password
executeActionsBody=Your MineSense Wana account is ready. Open this link to confirm your email and choose your password:\n\n{0}\n\nThe link works once and expires in {4}. If you did not ask for a Wana account, ignore this email.\n\nWana shows places worth checking. It does not prove a resource and gives no mining rights.
passwordResetSubject=Reset your MineSense Wana password
passwordResetBody=Someone asked to reset your MineSense Wana password. If it was you, open this link:\n\n{0}\n\nIt expires in {3}. If you did not ask, ignore this email; your password stays the same.
emailVerificationSubject=Confirm your email for MineSense Wana
emailVerificationBody=Open this link to confirm your email for MineSense Wana:\n\n{0}\n\nIt expires in {3}. If you did not create a Wana account, ignore this email.
