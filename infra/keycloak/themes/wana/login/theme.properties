# MineSense Wana sign-in theme: same split layout as the app's sign-up page. Page templates come from `base`;
# only the layout (template.ftl), styles and wording are ours. Missing resources (js) fall back to `base`.
parent=base
locales=en
styles=css/wana.css
meta=viewport==width=device-width,initial-scale=1

kcHtmlClass=wana
kcBodyClass=wana-body
kcFormGroupClass=field
kcFormSettingClass=field-options
kcLabelClass=field-label
kcInputClass=field-input
kcInputGroup=field-group
kcInputErrorMessageClass=field-error
kcInputWrapperClass=field-wrap
kcLabelWrapperClass=field-label-wrap
kcFormButtonsClass=field-buttons
kcFormOptionsWrapperClass=field-links
kcFormClass=wana-form
kcButtonClass=wbtn
kcButtonPrimaryClass=wbtn-primary
kcButtonDefaultClass=wbtn-default
kcButtonBlockClass=
kcButtonLargeClass=wbtn-lg
kcAlertClass=walert
kcAlertTitleClass=walert-text
kcFormPasswordVisibilityButtonClass=eye-btn
kcFormPasswordVisibilityIconShow=wi wi-eye
kcFormPasswordVisibilityIconHide=wi wi-eye-slash
kcResetFlowIcon=wi wi-arrow-repeat
kcCheckboxInputClass=field-check
