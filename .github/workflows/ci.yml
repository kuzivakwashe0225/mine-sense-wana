name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest -q
        working-directory: backend
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci && npm run lint && npm run build
        working-directory: frontend

  android:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach the APK to a GitHub Release on v* tags
    env:
      # the server the app talks to; change in repo Settings > Variables when you move to a real domain
      VITE_API_BASE: ${{ vars.WANA_API_BASE || 'https://wana.161-97-176-218.sslip.io' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
        working-directory: frontend
      - run: npm install && npm run sync
        working-directory: mobile
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        working-directory: mobile/android
      - run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk wana-field.apk
      - uses: actions/upload-artifact@v4
        with: { name: wana-field-apk, path: wana-field.apk }
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: wana-field.apk }
