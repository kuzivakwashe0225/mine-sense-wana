# Deployment on a server that already runs a reverse proxy (Caddy/nginx) on ports 80/443.
# The app listens only on 127.0.0.1:${WANA_PORT}; the proxy adds HTTPS (phones need it for GPS and offline install).
#   cd deploy && cp .env.example .env && edit .env && docker compose -f docker-compose.server.yml up -d --build
services:
  wana:
    build: ..
    environment:
      WANA_GEOLOGIST_KEY: ${WANA_GEOLOGIST_KEY:?set WANA_GEOLOGIST_KEY}
      # the web app's own origin, plus https://localhost which is the Android app's WebView origin
      WANA_CORS: https://${WANA_DOMAIN:?set WANA_DOMAIN},https://localhost
    # first start: no model yet, so build the SAMPLE dataset; replace with real data via `docker compose exec`
    command: sh -c 'ls /data/runs/v*/model.json >/dev/null 2>&1 || python -m wana all-sample; exec python -m wana serve --host 0.0.0.0 --port 8000'
    ports: ["127.0.0.1:${WANA_PORT:-8095}:8000"]
    volumes: [wana-data:/data]
    restart: unless-stopped
volumes:
  wana-data:
