# MineSense Wana: every service in its own container.
#
#   cp .env.example .env    # then fill in the secrets
#   docker compose up -d --build
#
# Public traffic reaches only `web` (nginx), which serves the app and routes /api to `api` and /auth to
# `keycloak`. Put TLS in front: the server's own Caddy, or `docker compose --profile standalone up` (adds Caddy).
# Admin consoles are bound to 127.0.0.1 only; reach them through an SSH tunnel.

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging: {driver: json-file, options: {max-size: "10m", max-file: "5"}}

services:
  web:
    <<: *hardening
    build: {context: ., dockerfile: infra/web.Dockerfile}
    ports: ["127.0.0.1:${WANA_PORT:-8095}:8080"]
    depends_on:
      api: {condition: service_healthy}
      keycloak: {condition: service_healthy}

  api:
    <<: *hardening
    build: {context: ., dockerfile: infra/api.Dockerfile}
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    environment:
      WANA_PUBLIC_URL: ${WANA_PUBLIC_URL:?set WANA_PUBLIC_URL}
      WANA_CORS: ${WANA_PUBLIC_URL},https://localhost
      WANA_ADMIN_EMAIL: ${WANA_ADMIN_EMAIL:-}
      KEYCLOAK_URL: http://keycloak:8080/auth
      KEYCLOAK_PUBLIC_URL: ${WANA_PUBLIC_URL}/auth
      KEYCLOAK_ADMIN_SECRET: ${WANA_KC_BACKEND_SECRET:?set WANA_KC_BACKEND_SECRET}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_APP_USER:-wana-app}
      MINIO_SECRET_KEY: ${MINIO_APP_PASSWORD:?set MINIO_APP_PASSWORD}
      MINIO_BUCKET: wana-photos
      WANA_IDLE_SECONDS: ${WANA_IDLE_SECONDS:-900}
      WANA_WARN_SECONDS: ${WANA_WARN_SECONDS:-60}
      WANA_READING_SECONDS: ${WANA_READING_SECONDS:-1800}
    volumes: [wana-data:/data]
    depends_on:
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
      keycloak: {condition: service_started}

  redis:
    <<: *hardening
    image: redis:7.4.5-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment: {REDIS_PASSWORD: "${REDIS_PASSWORD}"}

  minio:
    <<: *hardening
    # the official MinIO images are no longer published; Chainguard's build, pinned by digest
    image: cgr.dev/chainguard/minio:latest-dev@sha256:642552b21636e4c2a50bb0d805736b52231e76b67bac8f69443c7b3c7a849ac3
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-wana-root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports: ["127.0.0.1:${MINIO_CONSOLE_PORT:-9101}:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/minio/health/ready >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10

  minio-init:
    # one-shot: private bucket for field photos, and an app user that can only touch that bucket
    image: cgr.dev/chainguard/minio-client:latest-dev@sha256:cd7f5d19d115615d809f27343b1e5cfbdc84f38e1c9a29475535b74ec5bade50
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing local/wana-photos
        mc anonymous set none local/wana-photos
        mc version enable local/wana-photos
        printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject","s3:ListBucket","s3:GetBucketLocation"],"Resource":["arn:aws:s3:::wana-photos","arn:aws:s3:::wana-photos/*"]}]}' > /tmp/wana-app.json
        mc admin policy create local wana-app /tmp/wana-app.json || true
        mc admin user add local "$$MINIO_APP_USER" "$$MINIO_APP_PASSWORD"
        mc admin policy attach local wana-app --user "$$MINIO_APP_USER" || true
        echo "minio-init: bucket and app user ready"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-wana-root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_APP_USER: ${MINIO_APP_USER:-wana-app}
      MINIO_APP_PASSWORD: ${MINIO_APP_PASSWORD}
    depends_on:
      minio: {condition: service_healthy}

  mailpit:
    <<: *hardening
    # every email Keycloak sends passes through here; with WANA_SMTP_RELAY_* set it is also delivered for real
    image: axllent/mailpit:v1.27.4
    environment:
      MP_UI_AUTH: ${MAILPIT_UI_USER:-admin}:${MAILPIT_UI_PASSWORD:?set MAILPIT_UI_PASSWORD}
      MP_MAX_MESSAGES: 5000
      MP_SMTP_RELAY_HOST: ${WANA_SMTP_RELAY_HOST:-}
      MP_SMTP_RELAY_PORT: ${WANA_SMTP_RELAY_PORT:-587}
      MP_SMTP_RELAY_STARTTLS: "true"
      MP_SMTP_RELAY_AUTH: ${WANA_SMTP_RELAY_AUTH:-none}
      MP_SMTP_RELAY_USERNAME: ${WANA_SMTP_RELAY_USERNAME:-}
      MP_SMTP_RELAY_PASSWORD: ${WANA_SMTP_RELAY_PASSWORD:-}
      MP_SMTP_RELAY_ALL: ${WANA_SMTP_RELAY_ALL:-false}
    ports: ["127.0.0.1:${MAILPIT_UI_PORT:-8026}:8025"]
    volumes: [mailpit-data:/data]

  keycloak-db:
    <<: *hardening
    image: postgres:16.9-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?set KC_DB_PASSWORD}
    volumes: [keycloak-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 3s
      retries: 10

  keycloak:
    <<: *hardening
    image: quay.io/keycloak/keycloak:26.2.5
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak  # gitleaks:allow (address only, no credentials)
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${WANA_PUBLIC_URL}/auth
      KC_HOSTNAME_ADMIN: http://localhost:${KC_ADMIN_PORT:-8180}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?set KC_ADMIN_PASSWORD}
      # placeholders in infra/keycloak/realm-wana.json
      WANA_PUBLIC_URL: ${WANA_PUBLIC_URL}
      WANA_KC_BACKEND_SECRET: ${WANA_KC_BACKEND_SECRET}
      WANA_SMTP_HOST: mailpit
      WANA_SMTP_PORT: "1025"
      WANA_MAIL_FROM: ${WANA_MAIL_FROM:-no-reply@minesense-wana.local}
      WANA_MAIL_REPLY_TO: ${WANA_MAIL_REPLY_TO:-}
    ports: ["127.0.0.1:${KC_ADMIN_PORT:-8180}:8080"]
    volumes:
      - ./infra/keycloak/realm-wana.json:/opt/keycloak/data/import/realm-wana.json:ro
      - ./infra/keycloak/themes/wana:/opt/keycloak/themes/wana:ro
    depends_on:
      keycloak-db: {condition: service_healthy}
      mailpit: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  prometheus:
    <<: *hardening
    image: prom/prometheus:v3.4.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d", "--web.listen-address=:9090"]
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9190}:9090"]

  grafana:
    <<: *hardening
    image: grafana/grafana:12.0.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://localhost:${GRAFANA_PORT:-3110}/
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:${GRAFANA_PORT:-3110}:3000"]
    depends_on: [prometheus]

  caddy:
    # only for a server with nothing else on ports 80/443: `docker compose --profile standalone up -d`
    profiles: [standalone]
    <<: *hardening
    image: caddy:2.10.0-alpine
    command: caddy reverse-proxy --from ${WANA_DOMAIN:-localhost} --to web:8080
    ports: ["80:80", "443:443"]
    volumes: [caddy-data:/data]
    depends_on: [web]

volumes:
  wana-data:
  redis-data:
  minio-data:
  mailpit-data:
  keycloak-db:
  prometheus-data:
  grafana-data:
  caddy-data:
